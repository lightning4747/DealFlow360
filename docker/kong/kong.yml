_format_version: "3.0"
_transform: true

services:
  - name: dealflow-api-service
    url: http://host.docker.internal:3000
    routes:
      - name: internal-api-route
        paths:
          - /api/v1/internal
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 500
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - PATCH
                - DELETE
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - X-Correlation-ID
              credentials: true

      - name: portal-api-route
        paths:
          - /api/v1/portal
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 100
              policy: local
          - name: cors
            config:
              origins:
                - "*"
              methods:
                - GET
                - POST
                - OPTIONS
              headers:
                - Authorization
                - Content-Type
                - X-Correlation-ID
              credentials: true

plugins:
  - name: request-id
    config:
      header_name: X-Correlation-ID
      include_in_response: true
